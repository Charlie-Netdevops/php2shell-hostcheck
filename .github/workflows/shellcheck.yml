name: shellcheck

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check
        run: bash -n php2shell-hostcheck.sh
      - name: ShellCheck
        run: shellcheck -S warning php2shell-hostcheck.sh
      - name: Smoke test (JSON is valid)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq php-cli >/dev/null
          set +e
          sudo ./php2shell-hostcheck.sh --json > out.json
          code=$?
          set -e
          python3 -c "import json; d=json.load(open('out.json')); print(d['result'])"
          test "$code" -le 3
